name: BREP overlap oracle (weekly)

# Runs the OpenCascade-based independent overlap check on a small sample of
# random assemblies. Catches drift between the in-tree SAT kernel
# (planckton.ts:tetsOverlap) and brepjs's certified boolean kernel. If a
# divergence is ever found, the proof in docs/PROOF.md is broken.
#
# All values interpolated into JS are GitHub-controlled context only
# (context.runNumber, context.runId, context.repo, context.serverUrl).
# No user-supplied event payload is touched, so no shell-injection vector
# from this workflow.

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  brep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Run brepjsOverlap oracle
        id: brep
        run: npx tsx scripts/brepjsOverlap.ts
      - name: File an issue on failure
        if: failure() && steps.brep.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = `brepjsOverlap drift detected (run #${context.runNumber})`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The scheduled BREP overlap oracle reported a non-zero intersection volume.',
              'This means the in-tree SAT overlap test (`planckton.ts:tetsOverlap`) and the',
              'OpenCascade `intersect` kernel disagree on at least one tet pair in the test set.',
              'The proof in `docs/PROOF.md` (and likely `ALGORITHM_VERSION`) needs investigation.',
              '',
              `Run: ${runUrl}`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'overlap-drift'],
            });
