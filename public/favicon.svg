<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Hill T₁ orthoscheme ("Planckton") favicon.
       Vertices in 3D: V0=(0,0,0)  V1=(L,0,0)  V2=(L,L,0)  V3=(L,L,L).
       Projected with an off-axis isometric so all four vertices are distinct
       and the right-angle character of the orthoscheme reads at small sizes.
       Pixel coords below were tuned for the 64x64 viewBox. -->
  <rect width="64" height="64" rx="10" fill="#15181c"/>
  <!-- Visible front face V0-V1-V2 (isoceles right triangle, L,L,L√2) -->
  <polygon points="12,44 44,52 50,28" fill="#d83a3a" fill-opacity="0.92"/>
  <!-- Top face V0-V2-V3 (scalene right triangle, L,L√2,L√3), darker -->
  <polygon points="12,44 50,28 36,12" fill="#a02828" fill-opacity="0.85"/>
  <!-- Six edges of the tetrahedron -->
  <g stroke="#f5f5f0" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <line x1="12" y1="44" x2="44" y2="52"/>
    <line x1="44" y1="52" x2="50" y2="28"/>
    <line x1="50" y1="28" x2="12" y2="44"/>
    <line x1="12" y1="44" x2="36" y2="12"/>
    <line x1="44" y1="52" x2="36" y2="12"/>
    <line x1="50" y1="28" x2="36" y2="12"/>
  </g>
</svg>
